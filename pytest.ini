[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --tb=short

markers =
    ui: Web user interface tests (SauceDemo)
    api: Backend REST API tests (ReqRes)
    smoke: Smoke test suite (critical path checks)
    regression: Regression test suite (comprehensive validations)
    desktop: Desktop viewport browser tests (1920x1080)
    mobile: Mobile viewport browser tests (e.g. Pixel 5 / iPhone emulation)
