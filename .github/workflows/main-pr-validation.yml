name: Main Branch Integrity & PR Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Code Integrity & Pytest Discovery (Fast Gate)
  # =========================================================================
  validate-code-integrity:
    name: 1. Code Integrity & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m compileall config pages api tests

      - name: Verify Pytest Test Discovery
        run: |
          pytest --collect-only

  # =========================================================================
  # JOB 2: API Smoke Tests (0 Browsers, Pure REST HTTP)
  # =========================================================================
  api-smoke-gate:
    name: 2. API Smoke Gate
    needs: validate-code-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Smoke Tests
        run: |
          pytest -m "api and smoke"

  # =========================================================================
  # JOB 3: Multi-Browser UI Desktop Smoke (Chromium, Firefox, WebKit in parallel)
  # =========================================================================
  ui-smoke-desktop-matrix:
    name: "3. Desktop Smoke (${{ matrix.browser }})"
    needs: validate-code-integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ${{ matrix.browser }} browser & OS dependencies
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run Desktop Smoke on ${{ matrix.browser }}
        run: |
          pytest -m "ui and smoke and desktop" --browser ${{ matrix.browser }} -n auto

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.browser }}-failures
          path: artifacts/failures/
          if-no-files-found: ignore

  # =========================================================================
  # JOB 4: UI Mobile Smoke Tests (Chromium & WebKit emulation)
  # =========================================================================
  ui-smoke-mobile-gate:
    name: "4. Mobile Smoke (${{ matrix.browser }})"
    needs: validate-code-integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ${{ matrix.browser }} browser & OS dependencies
        run: |
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI Mobile Smoke Tests on ${{ matrix.browser }}
        run: |
          pytest -m "ui and smoke and mobile" --browser ${{ matrix.browser }} -n auto

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-${{ matrix.browser }}-failures
          path: artifacts/failures/
          if-no-files-found: ignore

  # =========================================================================
  # JOB 5: Final Merge Protection Gatekeeper (Depends on all gates)
  # =========================================================================
  main-merge-gatekeeper:
    name: 5. Main Merge Protection Gatekeeper
    needs:
      - validate-code-integrity
      - api-smoke-gate
      - ui-smoke-desktop-matrix
      - ui-smoke-mobile-gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate All Cross-Browser Gates Succeeded
        run: |
          echo "========================================================="
          echo "All pre-merge verification checks passed successfully!"
          echo "- Code integrity & pytest collection: PASSED"
          echo "- Backend API smoke tests:            PASSED"
          echo "- Desktop UI Smoke (Chrome, Firefox, WebKit): PASSED"
          echo "- Mobile UI Smoke (Chromium, WebKit):         PASSED"
          echo "This branch is safe to merge into 'main'."
          echo "========================================================="
